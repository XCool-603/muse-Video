# ============================================================================
# 构建镜像并推送到 GitHub Container Registry (GHCR)
#
# 触发：push 到 main、打 v* 标签、或在 Actions 页面手动触发。
#
# 推完之后，部署机上就不再需要本地编译前端和后端了：
#   .env 里设 SHORTDRAMA_IMAGE=ghcr.io/xcool-603/muse-video:latest
#   然后 ./deploy.sh --update   → 只做 docker pull + up -d（几秒）
#
# 首次使用：仓库 Settings → Actions → General 确认允许运行工作流；
# 推上来的包默认是私有的，见 docs/DOCKER.md「预构建镜像」一节。
# ============================================================================
name: 构建并推送镜像

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 目标平台。只有 ARM 机器（如 Oracle 免费机、部分 ARM VPS）才需要加 linux/arm64；
  # 加 arm64 后构建时间会明显变长（QEMU 模拟）。
  PLATFORMS: linux/amd64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # GHCR 要求镜像名全小写，而 GitHub 用户名可能含大写
      - name: 镜像名转小写
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 复用 Actions 缓存，依赖没变时后续构建快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max
