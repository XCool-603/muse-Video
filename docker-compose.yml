# ============================================================================
# 短剧聚合平台 —— 一键部署
#
#   docker compose up -d
#
# 默认使用 SQLite，数据落在命名卷 shortdrama-data，无需额外依赖。
# 想换 PostgreSQL 见 docker-compose.postgres.yml。
#
# 部署模式由 .env 里的 SHORTDRAMA_IMAGE 决定：
#   留空          源码模式：本地 docker compose build 构建（默认）
#   填 GHCR 地址  镜像模式：直接拉预构建镜像，不在本机编译，更新只需几秒
#
# 访问： http://localhost:8080
# ============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # 默认是本地构建的标签；设了 SHORTDRAMA_IMAGE 就换成远端镜像（见 docs/DOCKER.md）
    image: ${SHORTDRAMA_IMAGE:-shortdrama:latest}
    container_name: shortdrama
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8080}:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # ---- 数据库（默认 SQLite，零依赖）----
      Database__Provider: Sqlite
      ConnectionStrings__Default: "Data Source=/data/shortdrama.db"

      # ---- 访问口令门 ----
      # 未通过口令前整站不可访问。改这里即可，不用重建镜像。
      AccessGate__Enabled: "${ACCESS_GATE_ENABLED:-true}"
      AccessGate__Password: "${ACCESS_PASSWORD:-遵纪守法世界和平}"
      AccessGate__ValidDays: "30"

      # ---- JWT 密钥（生产务必替换）----
      Jwt__Key: "${JWT_KEY:-please-change-this-secret-key-in-production-2025}"
      Jwt__Issuer: ShortDrama
      Jwt__Audience: ShortDramaClient

      # ---- 演示数据（默认关闭，只用真实源）----
      Demo__Enabled: "false"

      # ---- 本地种子服务（可选增强，torrent-search）----
      # 关键：容器里的 127.0.0.1 指的是**容器自己**，不是宿主机。
      # 种子服务跑在宿主机上，所以这里必须用 host.docker.internal
      # （下面的 extra_hosts 让它在 Linux 上也能解析；Docker Desktop 原生支持）。
      # 如果种子服务也跑在 Docker 里、且与本服务同一个 compose 网络，改成它的服务名即可。
      Torrent__BaseUrl: "${TORRENT_BASE_URL:-http://host.docker.internal:8787}"
      Torrent__Enabled: "${TORRENT_ENABLED:-true}"

      # ---- 日志 ----
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning

    # 让容器能通过 host.docker.internal 访问宿主机（Linux 需要这行，Docker Desktop 自带）
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # SQLite 库文件 + 任何运行时数据
      - shortdrama-data:/data

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  shortdrama-data:
    driver: local
