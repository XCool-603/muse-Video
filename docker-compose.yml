# ============================================================================
# 短剧聚合平台 —— 一键部署
#
#   docker compose up -d
#
# 默认使用 SQLite，数据落在命名卷 shortdrama-data，无需额外依赖。
# 想换 PostgreSQL 见 docker-compose.postgres.yml。
#
# 部署模式由 .env 里的 SHORTDRAMA_IMAGE 决定（默认镜像名 docker-muse-video:latest）：
#   留空          本地模式：本地已有 docker-muse-video:latest 就直接用，没有才 build（默认）
#   填 GHCR 地址  镜像模式：直接拉预构建镜像，不在本机编译，更新只需几秒
#
# 访问： http://localhost:18080
#
# 容器数量：**只有 app 一个**（容器名与镜像名统一为 docker-muse-video，见下面 app 服务上的注释）。
#          想用 PostgreSQL 时套上 docker-compose.postgres.yml 才会变成 2 个容器。
# ⚠️ 固定的是**容器名**，卷名**没有固定**：仍然是 <项目名>_shortdrama-data
#    （项目名默认取部署目录名）。改卷名 = 换卷 = 已有数据全部变成孤儿，**别动卷名**。
# ============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # 默认标签与容器同名：docker-muse-video:latest；设了 SHORTDRAMA_IMAGE 就换成远端镜像（见 docs/DOCKER.md）
    image: ${SHORTDRAMA_IMAGE:-docker-muse-video:latest}

    # 容器名固定为 docker-muse-video。
    # 为什么这个固定名是安全的：它是**本项目专属**的名字，不会撞上别人的通用名
    # （redis / new-api 这类名字人人都可能用，本项目一个都不占）。
    # 代价：container_name 会**关掉 Compose 的项目名前缀**，所以同一台机器上
    # **不能从两个目录同时部署本项目** —— 第二个会报
    # 'Conflict. The container name "/docker-muse-video" is already in use'。
    # 名字真被占了别急着删：先 docker inspect 看归属，再
    # docker rename docker-muse-video docker-muse-video-old 解封（非破坏性）。
    #
    # ⚠️ 固定的是容器名，**卷名没有被固定**：仍然是 <项目名>_shortdrama-data
    #    （项目名默认取部署目录名，可用 COMPOSE_PROJECT_NAME 或 -p 指定）。
    #    改卷名 = 换卷 = 服务器上已有的 SQLite 数据、收藏、观看历史全部变成孤儿，
    #    应用起来是空的 —— **卷名一个字都不要改**。
    container_name: docker-muse-video
    restart: unless-stopped

    ports:
      - "${APP_PORT:-18080}:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # ---- 数据库（默认 SQLite，零依赖）----
      Database__Provider: Sqlite
      ConnectionStrings__Default: "Data Source=/data/shortdrama.db"

      # ---- 访问口令门 ----
      # 未通过口令前整站不可访问。改这里即可，不用重建镜像。
      AccessGate__Enabled: "${ACCESS_GATE_ENABLED:-true}"
      AccessGate__Password: "${ACCESS_PASSWORD:-遵纪守法世界和平}"
      AccessGate__ValidDays: "30"

      # ---- JWT 密钥（生产务必替换）----
      Jwt__Key: "${JWT_KEY:-please-change-this-secret-key-in-production-2025}"
      Jwt__Issuer: ShortDrama
      Jwt__Audience: ShortDramaClient

      # ---- 演示数据（默认关闭，只用真实源）----
      Demo__Enabled: "false"

      # ---- 本地种子服务（可选增强，torrent-search）----
      # 关键：容器里的 127.0.0.1 指的是**容器自己**，不是宿主机。
      # 种子服务跑在宿主机上，所以这里必须用 host.docker.internal
      # （下面的 extra_hosts 让它在 Linux 上也能解析；Docker Desktop 原生支持）。
      # 如果种子服务也跑在 Docker 里、且与本服务同一个 compose 网络，改成它的服务名即可。
      Torrent__BaseUrl: "${TORRENT_BASE_URL:-http://host.docker.internal:8787}"
      Torrent__Enabled: "${TORRENT_ENABLED:-true}"

      # ---- 日志 ----
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__System.Net.Http.HttpClient: Warning

    # 让容器能通过 host.docker.internal 访问宿主机（Linux 需要这行，Docker Desktop 自带）
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # SQLite 库文件 + 任何运行时数据
      - shortdrama-data:/data

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  shortdrama-data:
    driver: local
