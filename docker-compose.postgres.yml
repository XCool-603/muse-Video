# ============================================================================
# PostgreSQL 覆盖配置（可选）
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# 会把 app 切到 PostgreSQL，并额外拉起一个 postgres 容器。
# 适合多实例部署或数据量较大的场景；个人自用直接用默认的 SQLite 即可。
#
# ⚠️ 这里**不提供 Redis**。应用现在用的是进程内内存缓存（AddMemoryCache），
#    根本不连接 Redis —— 起一个没人连的容器只会多一个故障面：
#    它曾经让部署机上的 `redis` 这个名字被反复申请，撞上别的项目留下的同名容器
#    （报错 `Conflict. The container name "/redis" is already in use`，而那个容器压根不是本项目的）。
#    将来真要上分布式缓存再加，届时也**不要写 `container_name`**，让 Compose 自己加项目前缀。
# ============================================================================

services:
  app:
    environment:
      Database__Provider: PostgreSql
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=shortdrama;Username=shortdrama;Password=${POSTGRES_PASSWORD:-shortdrama_pwd}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shortdrama
      POSTGRES_USER: shortdrama
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-shortdrama_pwd}"
      TZ: Asia/Shanghai
      # 中文排序与大小写处理
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - shortdrama-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortdrama -d shortdrama"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # 默认不对外暴露端口；需要直连调试时取消注释
    # ports:
    #   - "5432:5432"

volumes:
  shortdrama-pgdata:
    driver: local
