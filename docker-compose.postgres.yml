# ============================================================================
# PostgreSQL 覆盖配置（可选）
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# 会把 app 切到 PostgreSQL，并额外拉起一个 postgres 容器。
# 适合多实例部署或数据量较大的场景；个人自用直接用默认的 SQLite 即可。
#
# ⚠️ 这里**不提供 Redis**。应用现在用的是进程内内存缓存（AddMemoryCache），
#    根本不连接 Redis —— 起一个没人连的容器只会多一个故障面：
#    它曾经让部署机上的 `redis` 这个名字被反复申请，撞上别的项目留下的同名容器
#    （报错 `Conflict. The container name "/redis" is already in use`，而那个容器压根不是本项目的）。
#    将来真要上分布式缓存再加，届时也**不要写 `container_name`**：通用名人人都可能用，
#    固定它只会跨项目撞名。本项目只有 app 那一个名字是专属的，所以只固定了它。
#
# 容器数量：默认（只用 docker-compose.yml）是 **1 个**容器 —— 名字固定为 `docker-muse-video`。
#    套上本文件后变成 **2 个**：`docker-muse-video`（app）+ `<项目名>-postgres-1`（postgres）。
#    ⚠️ postgres 服务**刻意不设 `container_name`**，它的名字继续带项目名前缀，跨项目不会撞名。
#    ⚠️ 卷名同样**没有被固定**：`<项目名>_shortdrama-data`、`<项目名>_shortdrama-pgdata`
#       —— **不要改卷名**（改卷名 = 换卷 = 已有数据全部变成孤儿）。
# ============================================================================

services:
  app:
    environment:
      Database__Provider: PostgreSql
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=shortdrama;Username=shortdrama;Password=${POSTGRES_PASSWORD:-shortdrama_pwd}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # 刻意不设 container_name：容器名仍是 <项目名>-postgres-1（带项目名前缀），
    # 这样即使机器上还有别的项目的 postgres 也不会撞名。
    # 被固定成 docker-muse-video 的只有 app（见 docker-compose.yml）。
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shortdrama
      POSTGRES_USER: shortdrama
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-shortdrama_pwd}"
      TZ: Asia/Shanghai
      # 中文排序与大小写处理
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - shortdrama-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortdrama -d shortdrama"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # 默认不对外暴露端口；需要直连调试时取消注释
    # ports:
    #   - "5432:5432"

volumes:
  shortdrama-pgdata:
    driver: local
